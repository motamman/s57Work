name: Tests

on:
  push:
  pull_request:

# The jobs only read the repo and run its Python; the token needs
# nothing more, and the checked-out tree must not carry it.
permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Run unit tests (pipeline test skips without GDAL/tippecanoe)
        run: python3 -m unittest discover -s tests -t . -v

  pipeline:
    name: End-to-end pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install GDAL and pyyaml
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin build-essential libsqlite3-dev zlib1g-dev
          pip install pyyaml
          ogrinfo --version
      - name: Install tippecanoe (same pinned version as the chart build)
        env:
          TIPPECANOE_VERSION: "2.79.0"
        run: |
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
          tippecanoe --version
      - name: Install go-pmtiles (writes the .pmtiles copy)
        env:
          # Pinned like tippecanoe; bump deliberately.
          PMTILES_VERSION: "1.31.2"
        run: |
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp pmtiles
          sudo install -m 755 /tmp/pmtiles /usr/local/bin/pmtiles
          pmtiles version
      - name: Run the full suite
        run: python3 -m unittest discover -s tests -t . -v
