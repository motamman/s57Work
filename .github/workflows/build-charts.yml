name: Build ENC Charts

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      builds:
        description: 'Comma-separated build names (leave empty to use active list from enc-sources.yaml)'
        required: false
        default: ''
      publish:
        description: >-
          test: build only; outputs go to run artifacts and R2 charts-test/<branch>/,
          the 'latest' release and R2 charts/ are untouched.
          release: publish to the 'latest' release and R2 charts/ (default branch only).
        type: choice
        required: true
        default: test
        options:
          - test
          - release

  # Monthly rebuild on the 1st at 2am UTC (sailing season: Apr-Nov)
  schedule:
    - cron: '0 2 1 4-11 *'

# Least privilege for the token: prepare and build only read the repo.
# The release job raises this to contents: write for itself.
permissions:
  contents: read

jobs:
  # ── Step 1: Read the config and produce a build matrix ──────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      # Test pathway: a manual run publishes only when 'release' is chosen,
      # and only from the default branch, so trying new code on a branch
      # can never overwrite the published charts. Scheduled runs publish.
      - name: Decide whether this run publishes
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ github.event.inputs.publish }}
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          publish=false
          if [ "$EVENT" = "schedule" ]; then
            publish=true
          elif [ "$CHOICE" = "release" ]; then
            if [ "$REF" != "$DEFAULT" ]; then
              echo "::error::'release' is only allowed from $DEFAULT (this run is on $REF). Merge first, or run as 'test'."
              exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            echo "This run PUBLISHES to the 'latest' release and R2 charts/." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "TEST run: outputs go to run artifacts and R2 charts-test/ only; nothing published is touched." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Parse enc-sources.yaml
        id: parse
        shell: python3 {0}
        run: |
          import json, os, yaml

          with open("enc-sources.yaml") as f:
              config = yaml.safe_load(f)

          # Use workflow_dispatch input if provided, otherwise use active list
          override = "${{ github.event.inputs.builds }}".strip()
          if override:
              active = [b.strip() for b in override.split(",")]
          else:
              active = config.get("active", [])

          base_url = config["base_url"]
          builds = config["builds"]
          matrix = []

          for name in active:
              if name not in builds:
                  print(f"WARNING: build '{name}' not found in enc-sources.yaml, skipping")
                  continue
              b = builds[name]
              # Output name derived from first source: 01CGD_ENCs.zip -> 01CGD_ENCs.mbtiles
              first_source = b["sources"][0]
              stem = first_source.rsplit(".", 1)[0]
              output = stem + ".mbtiles"
              matrix.append({
                  "name": name,
                  "output": output,
                  "pmtiles": stem + ".pmtiles",
                  "mode": b.get("mode", "by-band"),
                  "sources": [f"{base_url}/{s}" for s in b["sources"]],
                  "source_filenames": b["sources"],
              })

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

          print(f"Active builds: {[m['name'] for m in matrix]}")

  # ── Step 2: Build each active config ────────────────────────────────
  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Install tippecanoe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev
          # Pinned: an unpinned clone builds whatever master is that day, so
          # two runs a week apart could tile with different tippecanoe code.
          # Bump deliberately, then re-verify a district's tiles.
          git clone --depth 1 --branch "$TIPPECANOE_VERSION" https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          cd /tmp/tippecanoe && make -j$(nproc) && sudo make install
        env:
          TIPPECANOE_VERSION: "2.79.0"

      - name: Install GDAL
        run: |
          sudo apt-get install -y -qq gdal-bin

      - name: Install go-pmtiles (writes the .pmtiles copy)
        env:
          # Pinned like tippecanoe; bump deliberately.
          PMTILES_VERSION: "1.31.2"
        run: |
          curl -fsSL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" \
            | tar xz -C /tmp pmtiles
          sudo install -m 755 /tmp/pmtiles /usr/local/bin/pmtiles
          pmtiles version

      - name: Verify tools
        run: |
          tippecanoe --version
          which tile-join
          ogr2ogr --version
          pmtiles version

      - name: Download ENC sources
        run: |
          mkdir -p downloads
          for url in ${{ join(matrix.build.sources, ' ') }}; do
            filename=$(basename "$url")
            echo "Downloading $filename..."
            curl -fSL --retry 3 --retry-delay 5 -o "downloads/$filename" "$url"
            ls -lh "downloads/$filename"
          done

      - name: Run s57-to-mbtiles.py
        run: |
          chmod +x s57-to-mbtiles.py
          inputs=""
          for f in ${{ join(matrix.build.source_filenames, ' ') }}; do
            inputs="$inputs downloads/$f"
          done

          mode="${{ matrix.build.mode }}"
          mode_flags=""
          case "$mode" in
            by-band)    mode_flags="--by-band" ;;
            split-*)    mode_flags="--split ${mode#split-}" ;;
            sources)    mode_flags="" ;;  # inputs already have zoom ranges
            single)     mode_flags="" ;;
          esac

          python3 s57-to-mbtiles.py $inputs \
            $mode_flags \
            -o "${{ matrix.build.output }}" \
            --pmtiles \
            -j 2

      - name: Show result
        run: |
          ls -lh "data/tiles/${{ matrix.build.output }}" "data/tiles/${{ matrix.build.pmtiles }}"

      - name: Generate metadata
        shell: python3 {0}
        run: |
          import json, sqlite3, os

          mbtiles = "data/tiles/${{ matrix.build.output }}"
          pmtiles = "data/tiles/${{ matrix.build.pmtiles }}"
          name = os.path.splitext("${{ matrix.build.output }}")[0]

          db = sqlite3.connect(mbtiles)
          meta = dict(db.execute("SELECT name, value FROM metadata").fetchall())
          db.close()

          bounds = [float(x) for x in meta.get("bounds", "").split(",")]
          center = [float(x) for x in meta.get("center", "").split(",")]

          # Extract layer names from tippecanoe's json metadata
          layers = []
          if "json" in meta:
              tile_json = json.loads(meta["json"])
              layers = [l["id"] for l in tile_json.get("vector_layers", [])]

          sources = "${{ join(matrix.build.source_filenames, ',') }}".split(",")

          metadata = {
              "name": name,
              "description": "${{ matrix.build.name }}",
              "bounds": bounds,
              "center": center[:2] if len(center) >= 2 else None,
              "minzoom": int(meta.get("minzoom", 0)),
              "maxzoom": int(meta.get("maxzoom", 0)),
              # Most detailed compilation scale in the bundle (denominator);
              # chart plugins read the same row from the MBTiles metadata.
              "scale": int(meta["scale"]) if meta.get("scale") else None,
              "format": "pbf",
              "layers": layers,
              "enc_sources": [f"https://charts.noaa.gov/ENCs/{s}" for s in sources],
              "build_date": __import__("datetime").datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "file_size_mb": round(os.path.getsize(mbtiles) / 1048576, 1),
              # Same tiles and metadata as the .mbtiles, as a PMTiles archive.
              "pmtiles_file_size_mb": round(os.path.getsize(pmtiles) / 1048576, 1),
          }

          out = f"data/tiles/{name}.json"
          with open(out, "w") as f:
              json.dump(metadata, f, indent=2)

          print(json.dumps(metadata, indent=2))

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build.name }}
          path: |
            data/tiles/${{ matrix.build.output }}
            data/tiles/${{ matrix.build.pmtiles }}
            data/tiles/*.json
          retention-days: 7

  # ── Step 3: Create release, archive previous, prune old ─────────────
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Run even if some matrix builds failed — release whatever succeeded.
    # Never on a test run (see the prepare job).
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.prepare.outputs.publish == 'true' }}
    permissions:
      contents: write
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Update or create 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          files=$(find artifacts/ \( -name "*.mbtiles" -o -name "*.pmtiles" -o -name "*.json" \) -type f | sort)
          if [ -z "$files" ]; then
            echo "No successful builds produced artifacts — nothing to release."
            exit 1
          fi
          echo "Files for release:"
          ls -lh $files

          NOTES="Automated ENC chart build from NOAA S-57 data. Last update: $DATE."
          if ! gh release view "latest" >/dev/null 2>&1; then
            echo "Creating new 'latest' release..."
            gh release create "latest" --title "ENC Charts" --notes "$NOTES" --latest
          fi

          # Upload one file at a time so a single oversized or failed asset
          # can't abort the rest of the batch. --clobber replaces same-named
          # assets; assets from regions not rebuilt this run are preserved.
          MAX_ASSET_SIZE=2147483648  # GitHub hard limit: 2 GiB per release asset
          skipped=""
          failed=""
          for f in $files; do
            size=$(stat -c%s "$f")
            if [ "$size" -ge "$MAX_ASSET_SIZE" ]; then
              echo "::warning::Skipping $f ($(numfmt --to=iec $size)) — exceeds GitHub's 2 GiB release asset limit"
              skipped="$skipped $f"
              continue
            fi
            echo "Uploading $f ($(numfmt --to=iec $size))..."
            if ! gh release upload "latest" --clobber "$f"; then
              echo "::warning::Upload failed for $f"
              failed="$failed $f"
            fi
          done

          gh release edit "latest" --notes "$NOTES"

          echo "Current assets in 'latest':"
          gh release view "latest" --json assets --jq '.assets[].name'

          if [ -n "$skipped" ]; then
            echo "Skipped (over 2 GiB):$skipped"
          fi
          if [ -n "$failed" ]; then
            echo "Failed uploads:$failed"
            exit 1
          fi

      # Mirror every chart file to Cloudflare R2, which has no per-file
      # size limit — oversized charts (e.g. Alaska) land here even when
      # the GitHub release step had to skip them. Runs only when the R2
      # secrets are configured; otherwise skipped silently.
      - name: Upload to Cloudflare R2
        if: ${{ env.R2_ACCOUNT_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 predates the newer AWS SDK checksum defaults; only send
          # checksums when an operation strictly requires them.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${BUCKET%/}"  # tolerate a trailing slash in the secret
          files=$(find artifacts/ \( -name "*.mbtiles" -o -name "*.pmtiles" -o -name "*.json" \) -type f | sort)
          failed=""
          for f in $files; do
            name=$(basename "$f")
            echo "R2: uploading $name ($(numfmt --to=iec $(stat -c%s "$f")))..."
            if ! aws s3 cp --endpoint-url "$ENDPOINT" --no-progress \
                "$f" "s3://$BUCKET/charts/$name"; then
              echo "::warning::R2 upload failed for $name"
              failed="$failed $name"
            fi
          done
          echo "Objects now in R2:"
          aws s3 ls --endpoint-url "$ENDPOINT" "s3://$BUCKET/charts/" || true
          if [ -n "$failed" ]; then
            echo "Failed R2 uploads:$failed"
            exit 1
          fi

      # Rewrite the release notes with download links to the R2 copies —
      # listing the whole bucket, not just this run's files, so charts
      # from earlier runs stay linked. Files over GitHub's 2 GiB asset
      # limit are flagged as R2-only. Needs R2_PUBLIC_URL (the bucket's
      # r2.dev URL or custom domain); without it the notes stay plain.
      - name: Link R2 downloads from release notes
        if: ${{ env.R2_ACCOUNT_ID != '' && env.R2_PUBLIC_URL != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          BUCKET="${BUCKET%/}"  # tolerate a trailing slash in the secret
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PUB="${R2_PUBLIC_URL%/}"
          # R2_BUCKET may include an in-bucket folder ("bucket/folder");
          # the public host serves from the bucket root, so append that
          # folder to the link base here. R2_PUBLIC_URL never needs to
          # be anything but the bare public hostname.
          case "$BUCKET" in
            */*) PUB="$PUB/${BUCKET#*/}" ;;
          esac
          MAX_ASSET_SIZE=2147483648

          {
            echo "Automated ENC chart build from NOAA S-57 data. Last update: $DATE."
            echo
            echo "### All charts on R2 (no size limit)"
            echo
            aws s3 ls --endpoint-url "$ENDPOINT" "s3://$BUCKET/charts/" \
              | awk '$4 ~ /\.(mbtiles|pmtiles)$/ {print $3, $4}' | sort -k2 \
              | while read -r size name; do
                  note=""
                  if [ "$size" -ge "$MAX_ASSET_SIZE" ]; then
                    note=" *(R2 only — exceeds GitHub's 2 GiB asset limit)*"
                  fi
                  echo "- [$name]($PUB/charts/$name) ($(numfmt --to=iec "$size")B)$note"
                done
            echo
            echo "Each district is published twice with identical tiles: \`.mbtiles\` (SQLite) and \`.pmtiles\` (single-file archive for HTTP range requests). Per-chart metadata: same URLs with \`.json\`."
          } > notes.md

          cat notes.md
          gh release edit "latest" --notes-file notes.md

  # ── Test pathway: stage outputs where they cannot collide ───────────
  # Runs instead of `release` when the run does not publish. The built
  # files stay as run artifacts (7 days) and are mirrored to R2 under
  # charts-test/<branch>/ so they can be downloaded, decoded
  # (count-layer-by-zoom.py, verify-r2-charts.py --prefix) or served on a
  # test server. The 'latest' release and R2 charts/ are never touched.
  # Test objects are overwritten per branch on each run and are not
  # pruned automatically.
  test-stage:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result != 'skipped' && needs.prepare.outputs.publish != 'true' }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: List built files
        run: |
          files=$(find artifacts/ \( -name "*.mbtiles" -o -name "*.pmtiles" -o -name "*.json" \) -type f | sort)
          if [ -z "$files" ]; then
            echo "No successful builds produced artifacts."
            exit 1
          fi
          ls -lh $files
          {
            echo "### Test build outputs (not published)"
            echo
            echo "Run artifacts (7 days): see this run's Artifacts panel."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage to R2 charts-test/<branch>/
        if: ${{ env.R2_ACCOUNT_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          REF: ${{ github.ref_name }}
        run: |
          BUCKET="${BUCKET%/}"
          branch=$(echo "$REF" | tr -c 'A-Za-z0-9._\n' '-')  # slashes etc. become '-'
          prefix="charts-test/$branch"
          PUB="${R2_PUBLIC_URL%/}"
          case "$BUCKET" in
            */*) PUB="$PUB/${BUCKET#*/}" ;;
          esac
          files=$(find artifacts/ \( -name "*.mbtiles" -o -name "*.pmtiles" -o -name "*.json" \) -type f | sort)
          failed=""
          echo "R2 test prefix: s3://$BUCKET/$prefix/" | tee -a "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          for f in $files; do
            name=$(basename "$f")
            echo "R2: staging $name ($(numfmt --to=iec $(stat -c%s "$f")))..."
            if aws s3 cp --endpoint-url "$ENDPOINT" --no-progress \
                "$f" "s3://$BUCKET/$prefix/$name"; then
              if [ -n "$PUB" ]; then
                echo "- [$name]($PUB/$prefix/$name)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- $name" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::warning::R2 staging failed for $name"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed R2 staging:$failed"
            exit 1
          fi

